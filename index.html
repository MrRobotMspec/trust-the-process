/* ============================================================
   SHARED UTILITIES
   ============================================================ */

function ScrollProgress() {
  const [w, setW] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setW(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="scroll-progress" style={{ width: `${w}%` }} />;
}

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            obs.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: '0px 0px -60px 0px' }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  });
}

function ScrollToTop() {
  const { pathname } = useLocation();
  useEffect(() => { window.scrollTo({ top: 0, behavior: 'instant' }); }, [pathname]);
  return null;
}

const Button = ({ children, variant = 'primary', as = 'button', href, onClick, type = 'button', className = '' }) => {
  const base = 'inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-full font-semibold text-base tracking-wide transition-all duration-300 cursor-pointer border-none font-sans';
  const styles = {
    primary:  'bg-leaf text-offwhite shadow-soft hover:bg-deep hover:-translate-y-1 hover:shadow-medium',
    secondary:'bg-transparent text-deep border-2 border-brown/40 hover:border-leaf hover:text-leaf hover:-translate-y-1',
    ghost:    'bg-transparent text-leaf border-2 border-leaf hover:bg-leaf hover:text-offwhite hover:-translate-y-1',
    dark:     'bg-deep text-offwhite hover:bg-brown hover:-translate-y-1 shadow-soft',
  };
  const cls = `${base} ${styles[variant]} ${className}`;
  if (as === 'link' || href) return <a href={href} className={cls} onClick={onClick}>{children}</a>;
  return <button type={type} onClick={onClick} className={cls}>{children}</button>;
};

function ServiceModal({ service, onClose }) {

function ContactPage() {
  useReveal();
  const [form, setForm] = useState({ name: '', email: '', phone: '', subject: '', message: '' });
  const [errors, setErrors] = useState({});
  const [status, setStatus] = useState('idle');

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Please enter your name';
    if (!form.email.trim()) e.email = 'Please enter your email';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'Please enter a valid email';
    if (!form.subject.trim()) e.subject = 'Please enter a subject';
    if (!form.message.trim()) e.message = 'Please enter a message';
    return e;
  };

  const onSubmit = (ev) => {
    ev.preventDefault();
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length) return;
    setStatus('sending');
    setTimeout(() => {
      setStatus('success');
      setForm({ name: '', email: '', phone: '', subject: '', message: '' });
      setTimeout(() => setStatus('idle'), 5000);
    }, 900);
  };

  const update = (k) => (ev) => {
    setForm({ ...form, [k]: ev.target.value });
    if (errors[k]) setErrors({ ...errors, [k]: undefined });
  };

  const inputCls = (k) =>
    `w-full px-5 py-3.5 rounded-2xl bg-offwhite border font-light text-deep placeholder-brown/50 transition-all focus:outline-none focus:border-leaf focus:ring-2 focus:ring-leaf/20 ${
      errors[k] ? 'border-terra' : 'border-cream'
