<script type="text/babel">
const { useState, useEffect } = React;

/* ============================================================
   TINY ROUTER (no external dependency, works everywhere)
   ============================================================ */
const RouterCtx = React.createContext({ path: '/', navigate: () => {} });
const useRouter = () => React.useContext(RouterCtx);

function Router({ children }) {
  const [path, setPath] = useState(() => {
    const hash = window.location.hash.replace(/^#/, '');
    return hash || '/';
  });

  useEffect(() => {
    const onHash = () => {
      const hash = window.location.hash.replace(/^#/, '') || '/';
      setPath(hash);
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = (to) => {
    window.location.hash = to === '/' ? '/' : to;
  };

  return (
    <RouterCtx.Provider value={{ path, navigate }}>
      {children}
    </RouterCtx.Provider>
  );
}

function NavLink({ to, className, activeClassName, children }) {
  const { path, navigate } = useRouter();
  const isActive = path === to || (to !== '/' && path.startsWith(to));
  const cls = typeof className === 'function'
    ? className({ isActive })
    : `${className || ''} ${isActive ? (activeClassName || '') : ''}`.trim();
  return (
    <a
      href={`#${to}`}
      className={cls}
      onClick={(e) => { e.preventDefault(); navigate(to); }}
    >
      {children}
    </a>
  );
}

/* ============================================================
   SCROLL PROGRESS
   ============================================================ */
function ScrollProgress() {
  const [w, setW] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setW(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="scroll-progress" style={{ width: `${w}%` }} />;
}

/* ============================================================
   REVEAL ON SCROLL
   ============================================================ */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            obs.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: '0px 0px -60px 0px' }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  });
}

/* ============================================================

const Button = ({ children, variant = 'primary', href, onClick, type = 'button', className = '' }) => {
  const base = 'inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-full font-semibold text-base tracking-wide transition-all duration-300 cursor-pointer border-none font-sans';
  const styles = {
    primary:  'bg-leaf text-offwhite shadow-soft hover:bg-deep hover:-translate-y-1 hover:shadow-medium',
    secondary:'bg-transparent text-deep border-2 border-brown/40 hover:border-leaf hover:text-leaf hover:-translate-y-1',
    ghost:    'bg-transparent text-leaf border-2 border-leaf hover:bg-leaf hover:text-offwhite hover:-translate-y-1',
    dark:     'bg-deep text-offwhite hover:bg-brown hover:-translate-y-1 shadow-soft',
  };
  const cls = `${base} ${styles[variant]} ${className}`;
  if (href) return <a href={href} className={cls} onClick={onClick}>{children}</a>;
  return <button type={type} onClick={onClick} className={cls}>{children}</button>;
};

        }`}

          const isActive = path === l.to;

            <a
              key={l.to}

            >
              {l.label}
            </a>
          );
        })}
        <a
          href="#/contact"
          onClick={(e) => { e.preventDefault(); navigate('/contact'); setOpen(false); }}
          className="mt-4 px-10 py-4 rounded-full bg-leaf text-offwhite font-semibold text-lg shadow-soft"

          Book a Class
        </a>
      </div>
    </header>
  );
}

/* ============================================================
   CONTACT PAGE
   ============================================================ */
function ContactPage() {
  useReveal();
  const [form, setForm] = useState({ name: '', email: '', phone: '', subject: '', message: '' });
  const [errors, setErrors] = useState({});
  const [status, setStatus] = useState('idle');

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Please enter your name';
    if (!form.email.trim()) e.email = 'Please enter your email';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'Please enter a valid email';
    if (!form.subject.trim()) e.subject = 'Please enter a subject';
    if (!form.message.trim()) e.message = 'Please enter a message';
    return e;
  };

  const onSubmit = (ev) => {
    ev.preventDefault();
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length) return;
    setStatus('sending');
    setTimeout(() => {
      setStatus('success');
      setForm({ name: '', email: '', phone: '', subject: '', message: '' });
      setTimeout(() => setStatus('idle'), 5000);
    }, 900);
  };

  const update = (k) => (ev) => {
    setForm({ ...form, [k]: ev.target.value });
    if (errors[k]) setErrors({ ...errors, [k]: undefined });
  };

  const inputCls = (k) =>
    `w-full px-5 py-3.5 rounded-2xl bg-offwhite border font-light text-deep placeholder-brown/50 transition-all focus:outline-none focus:border-leaf focus:ring-2 focus:ring-leaf/20 ${
      errors[k] ? 'border-terra' : 'border-cream'
    }`;

  return (
    <div className="page-enter">
      <section className="relative pt-40 pb-20 md:pt-48 md:pb-24 overflow-hidden">
        <AnimatedBackground />
        <div className="max-w-4xl mx-auto px-6 text-center relative reveal">
          <p className="uppercase tracking-[0.4em] text-xs font-semibold text-leaf mb-5">Contact Us</p>
          <h1 className="font-bold text-[clamp(2.6rem,5.5vw,4.5rem)] leading-[1.1] tracking-tight text-deep mb-6">
            Let's Connect
          </h1>
          <p className="font-light text-xl text-brown max-w-2xl mx-auto leading-relaxed">
            Have a question about classes, memberships or starting your wellness journey? We'd love to hear from you.
          </p>
        </div>
      </section>

      <section className="relative pb-20 bg-base">
        <div className="max-w-7xl mx-auto px-6 md:px-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
          {[
            { label: 'Email', value: 'hello@trusttheprocess.co.za' },
            { label: 'Phone', value: '+27 XX XXX XXXX' },
            { label: 'Studio', value: '[Studio Address]' },
            { label: 'Hours', value: 'Mon – Sun' },
          ].map((c, i) => (
            <div
              key={c.label}
              className="reveal bg-offwhite rounded-organic p-7 border border-cream shadow-soft hover:-translate-y-2 hover:shadow-medium transition-all duration-500"
              style={{ transitionDelay: `${i * 80}ms` }}
            >
              <div className="w-12 h-12 rounded-full bg-leaf/10 flex items-center justify-center mb-4">
                <span className="w-3 h-3 rounded-full bg-leaf" />
              </div>
              <p className="uppercase tracking-widest text-xs font-semibold text-leaf mb-1">{c.label}</p>
              <p className="font-medium text-deep text-sm break-words">{c.value}</p>
            </div>
          ))}
        </div>
      </section>

      <section className="relative py-24 md:py-28 bg-cream">
        <div className="max-w-7xl mx-auto px-6 md:px-8 grid lg:grid-cols-2 gap-14">
          <div className="reveal">
            <h2 className="font-bold text-3xl md:text-4xl text-deep mb-3">Send us a message</h2>
            <p className="font-light text-brown mb-8">We typically respond within one business day.</p>

            {status === 'success' && (
              <div className="mb-6 px-5 py-4 rounded-2xl bg-leaf/15 border border-leaf/30 text-leaf font-medium">
                Thank you — your message has been sent. We'll be in touch soon.
              </div>
            )}

            <form onSubmit={onSubmit} noValidate className="space-y-5">
              <div>
                <label htmlFor="name" className="block text-sm font-semibold text-deep mb-2">Full Name *</label>
                <input id="name" type="text" value={form.name} onChange={update('name')} className={inputCls('name')} placeholder="Your full name" />
                {errors.name && <p className="text-terra text-xs mt-1.5">{errors.name}</p>}
              </div>

              <div className="grid sm:grid-cols-2 gap-5">
                <div>
                  <label htmlFor="email" className="block text-sm font-semibold text-deep mb-2">Email Address *</label>
                  <input id="email" type="email" value={form.email} onChange={update('email')} className={inputCls('email')} placeholder="you@example.com" />
                  {errors.email && <p className="text-terra text-xs mt-1.5">{errors.email}</p>}
                </div>
                <div>
                  <label htmlFor="phone" className="block text-sm font-semibold text-deep mb-2">Phone Number</label>
                  <input id="phone" type="tel" value={form.phone} onChange={update('phone')} className={inputCls('phone')} placeholder="+27 ..." />
                </div>
              </div>

              <div>
                <label htmlFor="subject" className="block text-sm font-semibold text-deep mb-2">Subject *</label>
                <input id="subject" type="text" value={form.subject} onChange={update('subject')} className={inputCls('subject')} placeholder="How can we help?" />
                {errors.subject && <p className="text-terra text-xs mt-1.5">{errors.subject}</p>}
              </div>

              <div>
                <label htmlFor="message" className="block text-sm font-semibold text-deep mb-2">Message *</label>
                <textarea id="message" rows="5" value={form.message} onChange={update('message')} className={inputCls('message') + ' resize-none'} placeholder="Tell us a little about what you're looking for..." />
                {errors.message && <p className="text-terra text-xs mt-1.5">{errors.message}</p>}
              </div>

              <Button type="submit" variant="primary" className="w-full sm:w-auto">
                {status === 'sending' ? 'Sending…' : 'Send Message'}
              </Button>
            </form>
          </div>

          <div className="reveal">
            <h2 className="font-bold text-3xl md:text-4xl text-deep mb-3">Visit the studio</h2>
            <p className="font-light text-brown mb-8">We'd love to welcome you in person.</p>
            <div className="rounded-organic overflow-hidden shadow-medium aspect-[4/3] bg-base relative border border-cream">
              <svg viewBox="0 0 600 450" className="w-full h-full" aria-label="Studio location placeholder map">
                <rect width="600" height="450" fill="#F0E8D9" />
                <g stroke="#8A6A4A" strokeOpacity="0.25" strokeWidth="1.5">
                  <path d="M0 120 L600 100" /><path d="M0 240 L600 260" /><path d="M0 360 L600 340" />
                  <path d="M120 0 L140 450" /><path d="M300 0 L290 450" /><path d="M460 0 L480 450" />
                </g>
                <circle cx="300" cy="225" r="46" fill="#65734A" opacity="0.12" />
                <circle cx="300" cy="225" r="24" fill="#65734A" opacity="0.25" />
                <circle cx="300" cy="225" r="10" fill="#4E3B2A" />
                <text x="300" y="290" textAnchor="middle" fontFamily="Montserrat" fontSize="14" fontWeight="600" fill="#4E3B2A">Trust the Process</text>
                <text x="300" y="312" textAnchor="middle" fontFamily="Montserrat" fontSize="11" fill="#8A6A4A">[Studio Address]</text>
              </svg>
            </div>
          </div>
        </div>
      </section>

      <CTASection
        title="Ready to begin?"
        text="Your first class is waiting. Reach out and we'll help you find the right practice for where you are right now."
        buttonLabel="Book a Class"
      />
    </div>
  );
}
